name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build App
      run: |
        xcodebuild -scheme StockChart -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO

    # 关键代码：直接把编译出来的 .app 打包
    - name: Package IPA
      run: |
        mkdir -p Payload
        # 寻找整个电脑里的 StockChart.app 并复制
        find . -name "StockChart.app" -type d -exec cp -R {} Payload/ \;
        zip -r StockChart.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StockChart-IPA
        path: StockChart.ipa
