name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build App
      run: |
        xcodebuild -scheme StockChart -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        mkdir -p Payload
        find . -name "*.app" -type d -exec cp -R {} Payload/ \;
        zip -r StockChart.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StockChart-IPA
        path: StockChart.ipa
